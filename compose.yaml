services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dateandtime
      MYSQL_USER: dateandtime
      MYSQL_PASSWORD: dateandtime_dev
      MYSQL_ROOT_PASSWORD: dateandtime_root_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/DateAndTime.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MySql: Server=mysql;Port=3306;Database=dateandtime;User=dateandtime;Password=dateandtime_dev
      Database__ServerVersion: 8.4.0
    ports:
      - "5080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
