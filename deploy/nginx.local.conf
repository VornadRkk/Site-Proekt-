server {
 listen 80;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
 location /api/ { proxy_pass http://api:8080; }
 location / { try_files $uri $uri/ /index.html; }
}
