services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dateandtime
      MYSQL_USER: dateandtime
      MYSQL_PASSWORD: dateandtime_dev
      MYSQL_ROOT_PASSWORD: dateandtime_root_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/DateAndTime.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MySql: Server=mysql;Port=3306;Database=dateandtime;User=dateandtime;Password=dateandtime_dev
      Database__ServerVersion: 8.4.0
      Jwt__Key: local-compose-jwt-key-change-before-shared-use-32-bytes
      Admin__Email: admin@dateandtime.local
      Admin__Password: ChangeMe123!
      Security__EnableClientAuth: "true"
    ports:
      - "5080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        VITE_USE_MOCKS: "false"
        VITE_API_URL: ""
        VITE_ENABLE_CLIENT_AUTH: "true"
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  mysql-exporter:
    image: prom/mysqld-exporter:v0.16.0
    command: ["--config.my-cnf=/cfg/.my.cnf"]
    volumes:
      - ./monitoring/mysql-exporter.cnf:/cfg/.my.cnf:ro
    depends_on:
      mysql:
        condition: service_healthy
    profiles: ["monitoring"]

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
      - mysql-exporter
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: grafana_dev
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    profiles: ["monitoring"]

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
