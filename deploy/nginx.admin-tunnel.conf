# Private administration through SSH local port forwarding only.
# Never expose this listener on 0.0.0.0 or a public interface.
server {
    listen 127.0.0.1:8081;
    server_name localhost 127.0.0.1;
    root /var/www/dateandtime/current/frontend;
    index index.html;
    server_tokens off;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Trusted loopback proxy: the remote connection is encrypted by SSH.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
    location = /health {
        proxy_pass http://127.0.0.1:5080/health;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /index.html { expires -1; }
    location / { try_files $uri $uri/ /index.html; }
}
